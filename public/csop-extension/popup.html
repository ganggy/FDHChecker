<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>FDH CSOP Session Sync</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 16px;
      background: #f8fafc;
      color: #0f172a;
      box-sizing: border-box;
    }
    .header {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 12px;
      border-bottom: 1px solid #e2e8f0;
      padding-bottom: 8px;
    }
    .header h3 {
      margin: 0;
      font-size: 15px;
      font-weight: 700;
      color: #0f766e;
    }
    p {
      font-size: 12px;
      color: #475569;
      line-height: 1.5;
      margin: 0 0 14px;
    }
    .btn {
      width: 100%;
      padding: 10px;
      background: #0d9488;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: background 0.2s;
    }
    .btn:hover {
      background: #0f766e;
    }
    .btn:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    #status {
      margin-top: 12px;
      font-size: 12px;
      line-height: 1.5;
      text-align: center;
      padding: 8px;
      border-radius: 6px;
      display: none;
    }
    .success {
      background: #dcfce7;
      color: #166534;
      border: 1px solid #bbf7d0;
      display: block !important;
    }
    .error {
      background: #fee2e2;
      color: #991b1b;
      border: 1px solid #fecaca;
      display: block !important;
    }
    .info {
      background: #e0f2fe;
      color: #0369a1;
      border: 1px solid #bae6fd;
      display: block !important;
    }
  </style>
</head>
<body>
  <div class="header">
    <span style="font-size: 20px;">🏥</span>
    <h3>FDH CSOP Session Sync</h3>
  </div>

  <p>
    กดปุ่มด้านล่างเพื่อดึงเซสชันที่เข้าสู่ระบบไว้จากเว็บ CSOP (<code style="color:#0f766e;">cs8.chi.or.th</code>) แล้วส่งเข้า FDH Checker อัตโนมัติทันที
  </p>

  <button id="btnSync" class="btn">
    ⚡ ดึงเซสชันส่งเข้า FDH Checker ทันที
  </button>

  <div id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
