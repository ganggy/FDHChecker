server {
    listen 80;
    server_name fdh.example.go.th;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name fdh.example.go.th;

    ssl_certificate /etc/letsencrypt/live/fdh.example.go.th/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fdh.example.go.th/privkey.pem;

    root /opt/FDHChecker/dist;
    index index.html;
    client_max_body_size 25m;

    location /api/ {
        proxy_pass http://127.0.0.1:3506;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
    }

    location /webhooks/ {
        proxy_pass http://127.0.0.1:3506;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
